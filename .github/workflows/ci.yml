name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ticketvault_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

    env:
      APP_NAME: TicketVault
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/ticketvault_test_db
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REDIS_URL: redis://localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_SUCCESS_URL: http://localhost/success
      STRIPE_CANCEL_URL: http://localhost/cancel
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASSWORD: test